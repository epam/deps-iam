[tool:pytest]
rootdir = .
cache_dir = /tmp/test_cache/.pytest_cache

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

[flake8]
ignore=
    WPS410,
    WPS421,
    F403,
    WPS609,
    F405,
    WPS347,
    WPS601,
    WPS502,
    WPS360,
    WPS440,
    WPS326,
    # Class without a base class
    WPS306,
    # Found `f` string
    WPS305
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Found empty comment
    WPS464,
    # Found local folder import
    WPS300,
    # Found `__init__.py` module with logic
    WPS412,
    # Found `else` in a loop without `break`
    WPS500,
    # Found too short name: x
    WPS111,
    # Found function with too much cognitive complexity NEED TO GOOGLE AND SET COGNITIVE
    WPS231,
    # Found incorrectly nested ternary
    WPS509,
    # Found too many imported names from a module
    WPS235,
    # Found string constant over-use
    WPS226,
    # Found a line that starts with a dot
    WPS348,
    # Found multiline conditions
    WPS337,
    # Found module with too many imports
    WPS201,
    # Found using `@staticmethod`
    WPS602,
    # Requests call with verify=False disabling SSL certificate checks, security issue
    S501,
    # Found too long ``try`` body length
    WPS229,
    # line break before binary operator
    W503 ,
    # Found a too complex `f` string
    WPS237,
    # Found a getter without a return value
    WPS463,
    # Found subclassing a builtin: str
    WPS600,
    # Do not perform function calls in argument defaults. This rule prevents us from using the recommended style of dependency_injector
    B008,
    # Found too many arguments
    WPS211,
    # Found complex default value
    WPS404,
    # Found nested class: Config
    WPS431,
    # Found too many expressions
    WPS213,
    # Found upper-case constant in a class
    WPS115,
    # Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # Found wrong keyword: pass
    WPS420,
    # Missing trailing comma
    C812,
    # Nested function
    WPS430,
    # Empty module
    WPS411,
    # Found incorrect order of methods in a class
    WPS338,
    # Found module with too many imported names
    WPS203,
    # Found `%` string formatting
    WPS323,
    # Found walrus operator
    WPS332,
    # Exception name should be named with an Error suffix
    N818,
    # Found too many empty lines in def
    WPS473,
    # Call to requests without timeout
    S113,
    WPS318,

allowed-domain-names =
    value,  # We allow using 'value' name when creating dictionaries
    file,   # We are working with files
    data,   # We use name 'data' in our models
    info    # We use it in settings

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
  # There are multiple `assert`s in tests, we allow them:
  src/tests/*.py: S101
  */__init__.py: F401
  ./deps_iam/domain/interfaces/*.py: WPS428 F401
  ./deps_iam/error_handlers.py: WPS430
  ./deps_iam/app.py: WPS433
  ./deps_iam/containers.py: WPS202 WPS203
  ./deps_iam/api/models/list.py: WPS110
  ./deps_iam/domain/dtos.py: WPS110
  ./deps_iam/infrastructure/repositories/organisation/repository.py: WPS204
  ./deps_iam/api/v1/organisation.py: WPS202, WPS204
  ./deps_iam/domain/services/authorization.py: WPS204
  ./deps_iam/containers.py: WPS203, WPS202
  ./deps_iam/domain/services/email_sender.py: WPS501
  ./deps_iam/domain/services/organisation.py: WPS220 WPS214
  ./deps_iam/domain/model/policy/statement/request_context/mappers/document_mapper.py: WPS204
  ./deps_iam/domain/model/policy/statement/request_context/mappers/corleone_mapper.py: WPS204
  ./deps_iam/infrastructure/repositories/policy/query_builder.py: WPS221 S608
  ./deps_iam/domain/model/policy/statement/request_context/mappers/iam_mapper.py: WPS204
  ./deps_iam/domain/model/group/group.py: WPS230, WPS214
  ./deps_iam/messaging/sagas_data/sign_up_data.py: WPS230, WPS214, WPS221
  ./deps_iam/messaging/sagas_data/sign_up_steps.py: WPS219, WPS221
  ./deps_iam/scripts/iam_init.py: WPS110, S105
  ./deps_iam/__main__.py: WPS216, WPS238
  ./deps_iam/extras/*: B024, B027, S105, WPS420, WPS604, WPS112, WPS615, WPS110, WPS430, WPS220, WPS331, WPS516, WPS437, WPS601, WPS326, WPS503, WPS338, WPS214, WPS608, P101, WPS433, WPS232, N805, WPS231


max-local-variables = 15
max-methods = 20
max-line-length = 130
max-module-members = 10
max-module-expressions = 10
max-line-complexity = 16

# radon section
radon-max-cc = 10
radon-show-closures = True
radon-no-assert = True

# to disable false positive N805
classmethod-decorators =
    classmethod
    validator
    root_validator

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
warn_no_return = False
disable_error_code = attr-defined, name-defined
exclude = (?x)(
    ^/vendors\.
    | ^deps_iam/__main__.py$
          )

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv
    __init__.py

[coverage:run]
omit =
    tests/*
    */__init__.py
    /vendors/*
    /app/.venv/*
    deps_iam/domain/interfaces/*
branch = True
data_file=/tmp/test_cache/.coverage
