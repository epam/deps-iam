databaseChangeLog:
  - changeSet:
      id: 1
      author: Dzmitry Orgish
      changes:
        - addColumn:
            tableName: user
            columns:
              - column:
                  name: organisation
                  type: VARCHAR
                  constraints:
                    nullable: true

  - changeSet:
      id: 2
      author: Dzmitry Orgish
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: organisation
            baseTableName: user
            constraintName: organisation_name_fkey
            onDelete: SET NULL
            referencedColumnNames: name
            referencedTableName: organisation
