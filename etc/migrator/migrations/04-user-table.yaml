databaseChangeLog:
- changeSet:
    id: 1
    author: Anton Navarka
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              primaryKey: true
              primaryKeyName: user_pkey
            name: pk
            type: VARCHAR(50)
        - column:
            constraints:
              nullable: false
            defaultValueComputed: now()
            name: created_at
            type: TIMESTAMP WITH TIME ZONE
        - column:
            constraints:
              nullable: false
            name: username
            type: VARCHAR(100)
        - column:
            constraints:
              nullable: false
            name: email
            type: VARCHAR(100)
        - column:
            name: first_name
            type: VARCHAR(100)
        - column:
            name: last_name
            type: VARCHAR(100)
        - column:
            name: deleted
            type: BOOLEAN
            defaultValue: false
        tableName: user