apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-polling-publisher
  labels:
    {{- include "deps-iam.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.iam.replicaCount }}
  selector:
    matchLabels:
      {{- include "deps-iam.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deps-iam.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.iam.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.iam.imagePullSecrets }}
      {{- end }}
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if or .Values.vault_settings.hashicorp_vault .Values.vault_settings.gcp_secret_manager .Values.vault_settings.aws_secret_manager }}
      serviceAccountName: {{ .Values.service_account.serviceAccountName }}
      {{- end }}
      {{ if .Values.iam_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
      initContainers:
        - name: init-{{ .Chart.Name }}
          image: busybox
          command: ["sh", "-c", "cp /home/inputdbcerts/* /home/outputdbcerts/ && chmod g-r /home/outputdbcerts/*.key"]
          volumeMounts:
            - name: tls-database-certs
              mountPath: /home/inputdbcerts
            - name: outputdbcerts
              mountPath: /home/outputdbcerts
      {{ end }}
      containers:
        - name: {{ .Chart.Name }}
          image: '{{ .Values.registry }}{{ .Values.polling_publisher.image.path }}:{{ .Values.polling_publisher.image.tag | default "latest" }}'
          imagePullPolicy: {{ .Values.iam.image.pullPolicy }}
          resources:
            {{- toYaml .Values.iam.resources | nindent 12 }}
          envFrom:
          - configMapRef:
              name: iam-api-configmap
              optional: false
          env:
          {{ if .Values.iam_settings.INSTRUMENTATION_ENABLED }}
            {{ if eq .Values.iam_settings.EXPORTER_TYPE "azure" }}
          - name: APPLICATION_INSIGHTS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.telemetry_secrets.secretName }}
                key: application-insights-connection-string
            {{ end }}
          {{ end }}
          {{- if .Values.vault_settings.enabled }}
          {{- toYaml .Values.vault_enabled_polling_publisher.env | nindent 10 }}
          {{ else }}
          {{- toYaml .Values.vault_disabled_polling_publisher.env | nindent 10 }}
          {{- end }}
          volumeMounts:
          {{ if .Values.iam_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
          - name: outputdbcerts
            mountPath: {{ .Values.certs_location.database_sslcerts_path }}
          {{ end }}
          {{- if .Values.vault_settings.enabled }}
          - name: secrets-store-inline
            mountPath: {{ .Values.secrets_location.secrets_default_path }}
            readOnly: true
          {{- end }}
      volumes:
      {{ if .Values.iam_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
      - name: tls-database-certs
        secret:
          secretName: {{ .Values.secrets.database_ssl_secret.secretName }}
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
            mode: 0600
          - key: root.crt
            path: root.crt
          defaultMode: 0644
      - name: outputdbcerts
        emptyDir: {}
      {{ end }}
      {{- if .Values.vault_settings.enabled }}
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.csi.csi_default_name }}
      {{- end }}
      {{- with .Values.iam.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.iam.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.iam.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
