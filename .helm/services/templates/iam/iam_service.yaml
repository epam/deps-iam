apiVersion: v1
kind: Service
metadata:
  name: iam
  labels:
    {{- include "deps-iam.labels" . | nindent 4 }}
spec:
  type: {{ .Values.iam.service.type }}
  ports:
    - port: {{ .Values.iam.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-iam.selectorLabels" . | nindent 4 }}
