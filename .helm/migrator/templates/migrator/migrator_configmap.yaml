apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-migrator-configmap
  labels:
    {{- include "deps-iam-migrator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
data:
  DATABASE_PORT: '{{ .Values.migration_settings.DATABASE_PORT }}'
  {{ if .Values.migration_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
  DATABASE_SSLKEY: {{ .Values.migration_settings.DATABASE_SSLKEY_PATH }}
  DATABASE_SSLCERT: {{ .Values.migration_settings.DATABASE_SSLCERT_PATH }}
  DATABASE_SSLROOTCERT: {{ .Values.migration_settings.DATABASE_SSLROOTCERT_PATH }}
  {{ end }}

