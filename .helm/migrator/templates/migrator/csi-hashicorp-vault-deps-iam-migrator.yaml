{{- if .Values.vault_settings.hashicorp_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: vault
  secretObjects:
  - data:
    - key: database-host
      objectName: database-host
    - key: database-user
      objectName: database-user
    - key: database-password
      objectName: database-password
    - key: database-db
      objectName: database-db
    secretName: {{ .Values.secrets.deps_iam_migrator.secretName }}
    type: Opaque
  parameters:
    roleName: {{ .Values.csi.roleName }}
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    objects: |
      - objectName: "database-host"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "database-host"

      - objectName: "database-user"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-iam/iam-database"
        secretKey: "database-user"

      - objectName: "database-password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-iam/iam-database"
        secretKey: "database-password"

      - objectName: "database-db"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-iam/iam-database"
        secretKey: "database-db"
{{- end }}
